name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned runner image rather than ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to full commit SHAs; the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          # Pinned Nix version. nixpkgs itself (Python, FastAPI, ruff, pytest, ...)
          # is pinned by flake.lock.
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install

      - name: Lint, test and build (nix flake check)
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Smoke test the packaged server
        run: |
          nix build --no-update-lock-file --print-build-logs
          HORSE_TINDER_DB="$RUNNER_TEMP/smoke.db" PORT=8765 ./result/bin/horse-tinder &
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8765/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/api/horses | grep -q '"horses"'
          curl -fsS http://127.0.0.1:8765/ | grep -q 'Horse Tinder'
